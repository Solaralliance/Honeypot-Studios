name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint, security, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install backend check dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          flake8==7.4.1 bandit==1.8.6 pytest==9.1.1 pytest-xdist==3.8.0
          fastapi==0.110.1 pydantic==2.13.5 python-dotenv==1.2.3
          stripe==14.4.1 requests==2.34.2
      - name: Check Python syntax and lint
        run: |
          python -m compileall -q backend scripts
          python -m flake8 --select=E9,F --max-line-length=140 backend
      - name: Run Bandit
        run: bandit -r backend -ll
      - name: Run secret scan
        run: python scripts/secret_scan.py "$GITHUB_WORKSPACE"
      - name: Run backend tests
        run: pytest -n 0
        working-directory: backend

  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          corepack enable
          yarn install --non-interactive --no-lockfile --ignore-scripts
      - name: Lint frontend
        working-directory: frontend
        run: yarn lint
      - name: Test frontend
        working-directory: frontend
        run: yarn test --watchAll=false --passWithNoTests
      - name: Build frontend
        working-directory: frontend
        run: yarn build
